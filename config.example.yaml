# Example configuration. Copy to config.yaml and replace the placeholder keys.
# config.yaml is git-ignored so local credentials are never committed.

general:
  drop_params: true

server:
  host: "0.0.0.0"
  port: 4000
  log_level: "info"

providers:
  example-provider:
    name: "Example Provider"
    base_url:
      openai: "https://api.example.com/v1"
      anthropic: "https://api.example.com"
    api_key: "sk-replace-me"
    max_retries: 3
    # `endpoints` is optional. Every configured base_url protocol starts with
    # all of its default endpoints:
    #   openai:    chat_completions -> /chat/completions
    #              responses        -> /responses
    #   anthropic: messages         -> /v1/messages
    # A listed protocol becomes an allow-list: only its listed endpoints are
    # enabled and an empty path uses the default. Protocols left out keep every
    # default endpoint. Custom paths must start with "/". For example:
    # endpoints:
    #   openai:
    #     chat_completions:
    #     responses:

models:
  example/model-1:
    name: "Example Model"
    context_length: 262144
    max_output_length: 65536
    modalities:
      input: ["text", "image", "video"]
      output: ["text"]
    providers:
      - provider_id: "example-provider"
        model_id: "example-model-1"
        weight: 1.0
        # Optional cap in seconds on waiting for a Retry-After before retrying
        # this provider. Omit for the 5 s default; 0 retries immediately.
        # max_retry_after: 10

users:
  example-user:
    name: "Example User"
    api_key: "sk-replace-me"
    allowed_models:
      - "example/model-1"