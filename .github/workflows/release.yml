# Publishes release artefacts when a version tag is pushed:
#   - multi-arch container images to GHCR and Docker Hub
#   - cross-compiled binaries and checksums as a GitHub Release
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account name (also used as the image namespace)
#   DOCKERHUB_TOKEN     Docker Hub access token with read/write scope
#
# GHCR uses the workflow's GITHUB_TOKEN, so no extra secret is needed there.
# Release tags are expected to look like v1.2.3 (optionally v1.2.3-rc.1).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives the image tags from the pushed tag: 1.2.3, 1.2, 1, latest and
      # (for stable tags only) stable. Every build moves latest, so it always
      # points at the most recently published image, pre-release or not.
      # Pre-release tags such as v1.2.3-rc.1 never update stable.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/llm-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Build binaries and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Cross-compiles a static binary for each supported platform. CGO is
      # disabled so the binaries are fully self-contained.
      - name: Build release archives
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"

            bin="llm-proxy"
            if [ "$goos" = "windows" ]; then
              bin="${bin}.exe"
            fi

            stage="build/${goos}_${goarch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags="-s -w -X github.com/ratsdev/llm-proxy/internal/version.Value=${version}" \
              -o "${stage}/${bin}" ./cmd/llm-proxy
            cp LICENSE "$stage/"

            name="llm-proxy_${version}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q -r "../../dist/${name}.zip" .)
            else
              (cd "$stage" && tar -czf "../../dist/${name}.tar.gz" .)
            fi
          done

          (cd dist && sha256sum -- * > checksums.txt)
          ls -l dist

      # Creates the release with generated notes on the first run for this tag;
      # re-running the workflow updates the existing release and its assets.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}